<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>道徳授業 - 生徒画面</title>

  <style>

    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }

    .box {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1 {
      text-align: center;
    }

    .question {
      font-size: 22px;
      line-height: 1.8;
      margin-top: 15px;
    }


    /* 班のタブ */

    .tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 12px 5px;
      border: 1px solid #aaa;
      background-color: #eee;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }

    .tab:hover {
      background-color: #ddd;
    }

    .tab.active {
      background-color: #333;
      color: white;
    }


    /* 班の内容 */

    .group-content {
      display: none;
    }

    .group-content.active {
      display: block;
    }


    /* 回答フォーム */

    .student-box {
      border: 1px solid #ccc;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .student-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 16px;
      resize: vertical;
    }

    .submit-button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .submit-button:hover {
      opacity: 0.8;
    }

    .submitted-answer {
      margin-top: 15px;
      padding: 15px;
      background-color: #f0f0f0;
      border-radius: 6px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .status {
      margin-top: 8px;
      font-size: 14px;
    }


    /* 入力中表示 */

    .typing-status {
      font-size: 14px;
      color: #0066cc;
      margin-bottom: 6px;
      min-height: 20px;
    }


    /* AIボタン */

    .ai-button-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    .ai-button {
      grid-column: 2;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background-color: #d60000;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .ai-button:hover {
      opacity: 0.85;
    }

    .ai-button:disabled {
      background-color: #999;
      cursor: not-allowed;
      opacity: 1;
    }

    .ai-instruction {
      grid-column: 3;
      font-size: 15px;
      line-height: 1.6;
      color: #333;
      min-width: 250px;
    }


    /* AI処理中表示 */

    .ai-processing-status {
      margin-top: 10px;
      font-size: 14px;
      color: #d60000;
      text-align: center;
      display: none;
    }


    /* AIからの問い */

    .ai-result {
      margin-top: 15px;
      padding: 10px 15px;
      background-color: white;
      border: 2px solid #d60000;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    .ai-result-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 6px;
    }


    @media (max-width: 600px) {

      .tabs {
        grid-template-columns: repeat(4, 1fr);
      }

      .question {
        font-size: 19px;
      }

      .ai-button-row {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .ai-button {
        grid-column: 1;
      }

      .ai-instruction {
        grid-column: 1;
        min-width: 0;
        text-align: center;
      }

    }

  </style>
</head>


<body>

  <h1>道徳授業</h1>


  <!-- 発問 -->

  <div class="box">

    <h2>発問</h2>

    <div
      id="question"
      class="question"
    >
      読み込み中……
    </div>

  </div>


  <!-- 班のタブ -->

  <div class="box">

    <h2>グループ</h2>

    <div class="tabs">

      <button class="tab active" data-group="1">1班</button>
      <button class="tab" data-group="2">2班</button>
      <button class="tab" data-group="3">3班</button>
      <button class="tab" data-group="4">4班</button>
      <button class="tab" data-group="5">5班</button>
      <button class="tab" data-group="6">6班</button>
      <button class="tab" data-group="7">7班</button>
      <button class="tab" data-group="8">8班</button>
      <button class="tab" data-group="9">9班</button>
      <button class="tab" data-group="10">10班</button>
      <button class="tab" data-group="11">11班</button>
      <button class="tab" data-group="12">12班</button>

    </div>


    <!-- 班の内容をここに自動生成 -->

    <div id="groupsContainer"></div>

  </div>


  <script type="module">

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      onSnapshot,
      serverTimestamp,
      runTransaction,
      Timestamp
    }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


    // ========================================
    // Firebase設定
    // ========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyARE4v_aZn606QafIKt3BoGCg82Fk04lKo",

      authDomain:
        "doutokuaiapp.firebaseapp.com",

      projectId:
        "doutokuaiapp",

      storageBucket:
        "doutokuaiapp.firebasestorage.app",

      messagingSenderId:
        "192277542082",

      appId:
        "1:192277542082:web:d21654cf75692e0b28375b"

    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    // ========================================
    // URLから授業IDを取得
    // ========================================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const lessonId =
      params.get("lessonId");


    // ========================================
    // このブラウザを識別するID
    // ========================================

    let clientId =
      localStorage.getItem("doutoku_client_id");

    if (!clientId) {

      clientId =
        crypto.randomUUID();

      localStorage.setItem(
        "doutoku_client_id",
        clientId
      );

    }


    // ========================================
    // 入力中タイマー
    // ========================================

    const typingTimers = {};


    // ========================================
    // 班の画面を作成
    // ========================================

    const groupsContainer =
      document.getElementById(
        "groupsContainer"
      );


    for (
      let group = 1;
      group <= 12;
      group++
    ) {

      const groupElement =
        document.createElement("div");

      groupElement.className =
        "group-content";


      if (group === 1) {

        groupElement.classList.add(
          "active"
        );

      }


      groupElement.dataset.groupContent =
        group;


      groupElement.innerHTML = `

        <h2>${group}班</h2>


        <div class="student-box">

          <div class="student-title">①</div>

          <div
            id="typing-${group}-1"
            class="typing-status"
          ></div>

          <textarea
            id="answer-${group}-1"
            placeholder="考えを入力してください"
          ></textarea>

          <br>

          <button
            class="submit-button"
            data-group="${group}"
            data-student="1"
          >
            回答する
          </button>

          <div
            id="status-${group}-1"
            class="status"
          ></div>

          <div
            id="submitted-${group}-1"
            class="submitted-answer"
            style="display:none;"
          ></div>

        </div>


        <div class="student-box">

          <div class="student-title">②</div>

          <div
            id="typing-${group}-2"
            class="typing-status"
          ></div>

          <textarea
            id="answer-${group}-2"
            placeholder="考えを入力してください"
          ></textarea>

          <br>

          <button
            class="submit-button"
            data-group="${group}"
            data-student="2"
          >
            回答する
          </button>

          <div
            id="status-${group}-2"
            class="status"
          ></div>

          <div
            id="submitted-${group}-2"
            class="submitted-answer"
            style="display:none;"
          ></div>

        </div>


        <div class="student-box">

          <div class="student-title">③</div>

          <div
            id="typing-${group}-3"
            class="typing-status"
          ></div>

          <textarea
            id="answer-${group}-3"
            placeholder="考えを入力してください"
          ></textarea>

          <br>

          <button
            class="submit-button"
            data-group="${group}"
            data-student="3"
          >
            回答する
          </button>

          <div
            id="status-${group}-3"
            class="status"
          ></div>

          <div
            id="submitted-${group}-3"
            class="submitted-answer"
            style="display:none;"
          ></div>

        </div>


        <div class="student-box">

          <div class="student-title">④</div>

          <div
            id="typing-${group}-4"
            class="typing-status"
          ></div>

          <textarea
            id="answer-${group}-4"
            placeholder="考えを入力してください"
          ></textarea>

          <br>

          <button
            class="submit-button"
            data-group="${group}"
            data-student="4"
          >
            回答する
          </button>

          <div
            id="status-${group}-4"
            class="status"
          ></div>

          <div
            id="submitted-${group}-4"
            class="submitted-answer"
            style="display:none;"
          ></div>

        </div>


        <!-- AIボタン -->

        <div class="ai-button-row">

          <button
            class="ai-button"
            data-group="${group}"
          >
            AI
          </button>

          <div class="ai-instruction">

            班のメンバーの回答がすべて表示されたら、<br>
            班の１人が１回だけボタンを押してください。

          </div>

        </div>


        <!-- AI処理中表示 -->

        <div
          id="ai-processing-${group}"
          class="ai-processing-status"
        >
          AIが処理中です。少し待ってください。
        </div>


        <!-- AIからの問い -->

        <div
          id="ai-result-${group}"
          class="ai-result"
          style="display:none;"
        >

          <div class="ai-result-title">
            🤖 AIからの問い
          </div>

          <div
            id="ai-result-text-${group}"
          ></div>

        </div>

      `;


      groupsContainer.appendChild(
        groupElement
      );

    }


    // ========================================
    // 授業情報を取得
    // ========================================

    async function loadLesson() {

      if (!lessonId) {

        document
          .getElementById("question")
          .textContent =
            "授業IDが指定されていません。";

        return;

      }


      try {

        const lessonRef =
          doc(
            db,
            "lessons",
            lessonId
          );


        const lessonSnap =
          await getDoc(
            lessonRef
          );


        if (!lessonSnap.exists()) {

          document
            .getElementById("question")
            .textContent =
              "授業が見つかりませんでした。";

          return;

        }


        const lessonData =
          lessonSnap.data();


        document
          .getElementById("question")
          .textContent =
            lessonData.question || "";


      } catch (error) {

        console.error(error);

        document
          .getElementById("question")
          .textContent =
            "授業情報の取得中にエラーが発生しました。";

      }

    }


    loadLesson();


    // ========================================
    // 班のタブを切り替える
    // ========================================

    const tabs =
      document.querySelectorAll(
        ".tab"
      );


    const groupContents =
      document.querySelectorAll(
        ".group-content"
      );


    tabs.forEach(tab => {

      tab.addEventListener(
        "click",
        () => {

          const group =
            tab.dataset.group;


          tabs.forEach(
            otherTab => {

              otherTab.classList.remove(
                "active"
              );

            }
          );


          tab.classList.add(
            "active"
          );


          groupContents.forEach(
            content => {

              content.classList.remove(
                "active"
              );

            }
          );


          const selectedContent =
            document.querySelector(
              `[data-group-content="${group}"]`
            );


          if (selectedContent) {

            selectedContent.classList.add(
              "active"
            );

          }

        }
      );

    });


    // ========================================
    // 回答を保存
    // ========================================

    const submitButtons =
      document.querySelectorAll(
        ".submit-button"
      );


    submitButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const group =
              button.dataset.group;

            const student =
              button.dataset.student;


            const textarea =
              document.getElementById(
                `answer-${group}-${student}`
              );


            const answer =
              textarea.value.trim();


            const status =
              document.getElementById(
                `status-${group}-${student}`
              );


            if (!answer) {

              status.textContent =
                "回答を入力してください。";

              return;

            }


            try {

              status.textContent =
                "保存中……";


              const answerRef =
                doc(
                  db,
                  "lessons",
                  lessonId,
                  "groups",
                  String(group),
                  "responses",
                  String(student)
                );


              await setDoc(
                answerRef,
                {
                  answer: answer,
                  updatedAt:
                    serverTimestamp(),
                  isTyping: false,
                  typingClientId: null,
                  typingAt: null
                },
                {
                  merge: true
                }
              );


              // 入力中タイマーを解除

              const timerKey =
                `${group}-${student}`;

              if (
                typingTimers[timerKey]
              ) {

                clearTimeout(
                  typingTimers[timerKey]
                );

              }


              status.textContent =
                "回答を保存しました。";


            } catch (error) {

              console.error(error);

              status.textContent =
                "保存中にエラーが発生しました。";

            }

          }
        );

      }
    );


    // ========================================
    // 入力中状態をFirestoreへ保存
    // ========================================

    for (
      let group = 1;
      group <= 12;
      group++
    ) {

      for (
        let student = 1;
        student <= 4;
        student++
      ) {

        const textarea =
          document.getElementById(
            `answer-${group}-${student}`
          );


        textarea.addEventListener(
          "input",
          async () => {

            const answerRef =
              doc(
                db,
                "lessons",
                lessonId,
                "groups",
                String(group),
                "responses",
                String(student)
              );


            const timerKey =
              `${group}-${student}`;


            if (
              typingTimers[timerKey]
            ) {

              clearTimeout(
                typingTimers[timerKey]
              );

            }


            try {

              await setDoc(
                answerRef,
                {
                  isTyping: true,
                  typingClientId: clientId,
                  typingAt:
                    serverTimestamp()
                },
                {
                  merge: true
                }
              );

            } catch (error) {

              console.error(
                "入力中状態の保存エラー:",
                error
              );

            }


            typingTimers[timerKey] =
              setTimeout(
                async () => {

                  try {

                    await setDoc(
                      answerRef,
                      {
                        isTyping: false,
                        typingClientId: null,
                        typingAt: null
                      },
                      {
                        merge: true
                      }
                    );

                  } catch (error) {

                    console.error(
                      "入力中状態解除エラー:",
                      error
                    );

                  }

                },
                5000
              );

          }
        );


        textarea.addEventListener(
          "blur",
          async () => {

            const timerKey =
              `${group}-${student}`;


            if (
              typingTimers[timerKey]
            ) {

              clearTimeout(
                typingTimers[timerKey]
              );

            }


            const answerRef =
              doc(
                db,
                "lessons",
                lessonId,
                "groups",
                String(group),
                "responses",
                String(student)
              );


            try {

              await setDoc(
                answerRef,
                {
                  isTyping: false,
                  typingClientId: null,
                  typingAt: null
                },
                {
                  merge: true
                }
              );

            } catch (error) {

              console.error(
                "入力中状態解除エラー:",
                error
              );

            }

          }
        );

      }

    }


    // ========================================
    // Firestoreの回答をリアルタイム表示
    // ========================================

    for (
      let group = 1;
      group <= 12;
      group++
    ) {

      const responsesRef =
        collection(
          db,
          "lessons",
          lessonId,
          "groups",
          String(group),
          "responses"
        );


      onSnapshot(
        responsesRef,
        snapshot => {

          snapshot.forEach(
            docSnapshot => {

              const student =
                docSnapshot.id;


              const data =
                docSnapshot.data();


              const answerArea =
                document.getElementById(
                  `submitted-${group}-${student}`
                );


              const textarea =
                document.getElementById(
                  `answer-${group}-${student}`
                );


              const typingStatus =
                document.getElementById(
                  `typing-${group}-${student}`
                );


              const submitButton =
                document.querySelector(
                  `.submit-button[data-group="${group}"][data-student="${student}"]`
                );


              if (!answerArea) {

                return;

              }


              // ========================================
              // 保存済み回答
              // ========================================

              if (data.answer) {

                answerArea.textContent =
                  data.answer;

                answerArea.style.display =
                  "block";


                // 自分が現在入力中の場合は
                // Firestoreの回答で上書きしない

                if (
                  document.activeElement !==
                  textarea
                ) {

                  textarea.value =
                    data.answer;

                }


                // 回答済みなら入力欄とボタンを無効化

                textarea.disabled =
                  true;

                submitButton.disabled =
                  true;

              }


              // ========================================
              // 入力中表示
              // ========================================

              if (
                data.isTyping === true &&
                data.typingClientId !== clientId
              ) {

                typingStatus.textContent =
                  `🔵 ${student}は入力中です`;

              } else {

                typingStatus.textContent =
                  "";

              }

            }
          );

        },

        error => {

          console.error(
            "リアルタイム取得エラー:",
            error
          );

        }

      );

    }


    // ========================================
    // AI処理
    // ========================================

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbyT6OiEgEPmSooooI9FD3a5ty5HQx4A1VRfTkQfNY-c7uuht1wNcXk2197o4ggLTuMs/exec";


    const aiButtons =
      document.querySelectorAll(
        ".ai-button"
      );


    aiButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const group =
              button.dataset.group;


            const groupRef =
              doc(
                db,
                "lessons",
                lessonId,
                "groups",
                String(group)
              );


            // ========================================
            // AI処理ロックを取得
            // ========================================

            let lockAcquired =
              false;


            try {

              await runTransaction(
                db,
                async transaction => {

                  const groupSnap =
                    await transaction.get(
                      groupRef
                    );


                  const groupData =
                    groupSnap.exists()
                      ? groupSnap.data()
                      : {};


                  const processing =
                    groupData.aiProcessing === true;


                  const processingAt =
                    groupData.aiProcessingAt;


                  let isStale =
                    false;


                  if (
                    processing &&
                    processingAt
                  ) {

                    let processingTime =
                      null;


                    if (
                      processingAt instanceof Timestamp
                    ) {

                      processingTime =
                        processingAt.toMillis();

                    }


                    if (
                      processingTime
                    ) {

                      const elapsed =
                        Date.now() -
                        processingTime;


                      if (
                        elapsed >
                        2 * 60 * 1000
                      ) {

                        isStale =
                          true;

                      }

                    }

                  }


                  if (
                    processing &&
                    !isStale
                  ) {

                    throw new Error(
                      "AI処理中です。少し待ってください。"
                    );

                  }


                  transaction.set(
                    groupRef,
                    {
                      aiProcessing:
                        true,

                      aiProcessingClientId:
                        clientId,

                      aiProcessingAt:
                        Timestamp.now()
                    },
                    {
                      merge: true
                    }
                  );


                  lockAcquired =
                    true;

                }
              );


              // ========================================
              // 授業情報を取得
              // ========================================

              const lessonRef =
                doc(
                  db,
                  "lessons",
                  lessonId
                );


              const lessonSnap =
                await getDoc(
                  lessonRef
                );


              if (
                !lessonSnap.exists()
              ) {

                throw new Error(
                  "授業情報が見つかりませんでした。"
                );

              }


              const lessonData =
                lessonSnap.data();


              // ========================================
              // 班の回答を取得
              // ========================================

              const responsesRef =
                collection(
                  db,
                  "lessons",
                  lessonId,
                  "groups",
                  String(group),
                  "responses"
                );


              const responsesSnap =
                await new Promise(
                  (resolve, reject) => {

                    const unsubscribe =
                      onSnapshot(
                        responsesRef,
                        snapshot => {

                          unsubscribe();

                          resolve(
                            snapshot
                          );

                        },

                        error => {

                          unsubscribe();

                          reject(
                            error
                          );

                        }
                      );

                  }
                );


              const answers = [];


              responsesSnap.forEach(
                docSnapshot => {

                  const data =
                    docSnapshot.data();


                  if (
                    data.answer &&
                    data.answer.trim()
                  ) {

                    answers.push({
                      student:
                        docSnapshot.id,

                      answer:
                        data.answer
                    });

                  }

                }
              );


              // ========================================
              // AIへ送信するデータ
              // ========================================

              const requestData = {

                question:
                  lessonData.question || "",

                mainContentItem:
                  lessonData.mainContentItem || "",

                relatedContentItems:
                  lessonData.relatedContentItems || [],

                group:
                  String(group),

                answers:
                  answers

              };


              // ========================================
              // GASへ送信
              // ========================================

              const response =
                await fetch(
                  GAS_URL,
                  {
                    method: "POST",

                    headers: {
                      "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                      JSON.stringify(
                        requestData
                      )
                  }
                );


              if (
                !response.ok
              ) {

                throw new Error(
                  `AI通信エラー: ${response.status}`
                );

              }


              const result =
                await response.json();


              if (
                !result.success
              ) {

                throw new Error(
                  result.error ||
                  "AI処理に失敗しました。"
                );

              }


              // ========================================
              // AI結果を保存
              // ========================================

              await setDoc(
                groupRef,
                {
                  aiResult:
                    result.result,

                  aiUpdatedAt:
                    serverTimestamp()
                },
                {
                  merge: true
                }
              );


            } catch (error) {

              console.error(
                "AI処理エラー:",
                error
              );


              if (
                lockAcquired
              ) {

                try {

                  await setDoc(
                    groupRef,
                    {
                      aiProcessing:
                        false,

                      aiProcessingClientId:
                        null,

                      aiProcessingAt:
                        null
                    },
                    {
                      merge: true
                    }
                  );

                } catch (
                  unlockError
                ) {

                  console.error(
                    "AIロック解除エラー:",
                    unlockError
                  );

                }

              }


              alert(
                error.message ||
                "AI処理中にエラーが発生しました。"
              );

            }

          }
        );

      }
    );


    // ========================================
    // AI結果・AI処理状態をリアルタイム表示
    // ========================================

    for (
      let group = 1;
      group <= 12;
      group++
    ) {

      const groupRef =
        doc(
          db,
          "lessons",
          lessonId,
          "groups",
          String(group)
        );


      onSnapshot(
        groupRef,
        async snapshot => {

          if (
            !snapshot.exists()
          ) {

            return;

          }


          const data =
            snapshot.data();


          const aiButton =
            document.querySelector(
              `.ai-button[data-group="${group}"]`
            );


          const processingStatus =
            document.getElementById(
              `ai-processing-${group}`
            );


          const resultArea =
            document.getElementById(
              `ai-result-${group}`
            );


          const resultText =
            document.getElementById(
              `ai-result-text-${group}`
            );


          // ========================================
          // AI処理中
          // ========================================

          if (
            data.aiProcessing === true
          ) {

            aiButton.disabled =
              true;


            processingStatus.style.display =
              "block";


            if (
              data.aiProcessingClientId ===
              clientId
            ) {

              aiButton.textContent =
                "生成中…";

            } else {

              aiButton.textContent =
                "待機中";

            }

          } else {

            aiButton.disabled =
              false;

            aiButton.textContent =
              "AI";

            processingStatus.style.display =
              "none";

          }


          // ========================================
          // AI結果
          // ========================================

          if (
            data.aiResult
          ) {

            resultText.textContent =
              data.aiResult;

            resultArea.style.display =
              "block";

          }

        }
      );

    }

  </script>

</body>
</html>
