<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>道徳授業 - 生徒画面</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }

    .box {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1 {
      text-align: center;
    }

    .question {
      font-size: 22px;
      line-height: 1.8;
      margin-top: 15px;
    }

    /* 班のタブ */
    .tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 12px 5px;
      border: 1px solid #aaa;
      background-color: #eee;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }

    .tab:hover {
      background-color: #ddd;
    }

    .tab.active {
      background-color: #333;
      color: white;
    }

    /* 班の内容 */
    .group-content {
      display: none;
    }

    .group-content.active {
      display: block;
    }

    /* 回答フォーム */
    .student-box {
      border: 1px solid #ccc;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .student-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 16px;
      resize: vertical;
    }

    textarea:disabled {
      background-color: #eeeeee;
      color: #555;
    }

    .submit-button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .submit-button:hover {
      opacity: 0.8;
    }

    .submit-button:disabled {
      background-color: #999;
      cursor: not-allowed;
      opacity: 1;
    }

    .submitted-answer {
      margin-top: 15px;
      padding: 15px;
      background-color: #f0f0f0;
      border-radius: 6px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .status {
      margin-top: 8px;
      font-size: 14px;
    }

    /* 入力中表示 */
    .typing-status {
      margin-top: 8px;
      font-size: 14px;
      color: #0066cc;
    }

    /* AIエリア */
    .ai-area {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #ddd;
    }

    .ai-button-row {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* AIボタン */
    .ai-button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background-color: #d60000;
      color: white;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    .ai-button:hover {
      background-color: #b00000;
    }

    .ai-button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    /* AIボタン横の説明 */
    .ai-instruction {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
      flex: 1;
      min-width: 250px;
    }

    /* AI処理中表示 */
    .ai-processing-status {
      margin-top: 12px;
      padding: 10px 15px;
      background-color: #fff3cd;
      border: 1px solid #ffe69c;
      border-radius: 6px;
      color: #664d03;
      font-size: 15px;
    }

    /* AI結果 */
    .ai-result {
      margin-top: 20px;
      padding: 20px;
      background-color: #eef7ff;
      border: 2px solid #99cfff;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.8;
    }

    .ai-result-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {

      .tabs {
        grid-template-columns: repeat(4, 1fr);
      }

      .question {
        font-size: 19px;
      }

      .ai-button {
        width: 65px;
        height: 65px;
        font-size: 20px;
      }

      .ai-instruction {
        font-size: 14px;
      }
    }
  </style>
</head>


<body>

  <h1>道徳授業</h1>


  <!-- 発問 -->
  <div class="box">

    <h2>発問</h2>

    <div
      id="question"
      class="question"
    >
      読み込み中……
    </div>

  </div>


  <!-- 班のタブ -->
  <div class="box">

    <h2>グループ</h2>

    <div class="tabs">

      <button class="tab active" data-group="1">1班</button>
      <button class="tab" data-group="2">2班</button>
      <button class="tab" data-group="3">3班</button>
      <button class="tab" data-group="4">4班</button>
      <button class="tab" data-group="5">5班</button>
      <button class="tab" data-group="6">6班</button>
      <button class="tab" data-group="7">7班</button>
      <button class="tab" data-group="8">8班</button>
      <button class="tab" data-group="9">9班</button>
      <button class="tab" data-group="10">10班</button>
      <button class="tab" data-group="11">11班</button>
      <button class="tab" data-group="12">12班</button>

    </div>


    <!-- 班の内容をここに自動生成 -->
    <div id="groupsContainer"></div>

  </div>


  <script type="module">

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      onSnapshot,
      serverTimestamp,
      Timestamp,
      runTransaction
    }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


    // ========================================
    // Firebase設定
    // ========================================

    const firebaseConfig = {

      apiKey: "AIzaSyARE4v_aZn606QafIKt3BoGCg82Fk04lKo",

      authDomain:
        "doutokuaiapp.firebaseapp.com",

      projectId:
        "doutokuaiapp",

      storageBucket:
        "doutokuaiapp.firebasestorage.app",

      messagingSenderId:
        "192277542082",

      appId:
        "1:192277542082:web:d21654cf75692e0b28375b"

    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    // ========================================
    // URLから授業IDを取得
    // ========================================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const lessonId =
      params.get("lessonId");


    // ========================================
    // この端末を識別するID
    // ========================================

    let clientId =
      localStorage.getItem(
        "doutokuClientId"
      );


    if (!clientId) {

      clientId =
        crypto.randomUUID();

      localStorage.setItem(
        "doutokuClientId",
        clientId
      );

    }


    // ========================================
    // 班の画面を作成
    // ========================================

    const groupsContainer =
      document.getElementById(
        "groupsContainer"
      );


    for (
      let group = 1;
      group <= 12;
      group++
    ) {

      const groupElement =
        document.createElement("div");


      groupElement.className =
        "group-content";


      if (group === 1) {

        groupElement.classList.add(
          "active"
        );

      }


      groupElement.dataset.groupContent =
        group;


      groupElement.innerHTML = `

        <h2>${group}班</h2>


        <!-- ① -->
        <div class="student-box">

          <div class="student-title">
            ①
          </div>

          <textarea
            id="answer-${group}-1"
            placeholder="考えを入力してください"
          ></textarea>

          <br>

          <button
            class="submit-button"
            data-group="${group}"
            data-student="1"
          >
            回答する
          </button>

          <div
            id="status-${group}-1"
            class="status"
          ></div>

          <div
            id="typing-${group}-1"
            class="typing-status"
          ></div>

          <div
            id="submitted-${group}-1"
            class="submitted-answer"
            style="display:none;"
          ></div>

        </div>


        <!-- ② -->
        <div class="student-box">

          <div class="student-title">
            ②
          </div>

          <textarea
            id="answer-${group}-2"
            placeholder="考えを入力してください"
          ></textarea>

          <br>

          <button
            class="submit-button"
            data-group="${group}"
            data-student="2"
          >
            回答する
          </button>

          <div
            id="status-${group}-2"
            class="status"
          ></div>

          <div
            id="typing-${group}-2"
            class="typing-status"
          ></div>

          <div
            id="submitted-${group}-2"
            class="submitted-answer"
            style="display:none;"
          ></div>

        </div>


        <!-- ③ -->
        <div class="student-box">

          <div class="student-title">
            ③
          </div>

          <textarea
            id="answer-${group}-3"
            placeholder="考えを入力してください"
          ></textarea>

          <br>

          <button
            class="submit-button"
            data-group="${group}"
            data-student="3"
          >
            回答する
          </button>

          <div
            id="status-${group}-3"
            class="status"
          ></div>

          <div
            id="typing-${group}-3"
            class="typing-status"
          ></div>

          <div
            id="submitted-${group}-3"
            class="submitted-answer"
            style="display:none;"
          ></div>

        </div>


        <!-- ④ -->
        <div class="student-box">

          <div class="student-title">
            ④
          </div>

          <textarea
            id="answer-${group}-4"
            placeholder="考えを入力してください"
          ></textarea>

          <br>

          <button
            class="submit-button"
            data-group="${group}"
            data-student="4"
          >
            回答する
          </button>

          <div
            id="status-${group}-4"
            class="status"
          ></div>

          <div
            id="typing-${group}-4"
            class="typing-status"
          ></div>

          <div
            id="submitted-${group}-4"
            class="submitted-answer"
            style="display:none;"
          ></div>

        </div>


        <!-- AI -->
        <div class="ai-area">

          <div class="ai-button-row">

            <button
              class="ai-button"
              data-group="${group}"
            >
              AI
            </button>

            <div class="ai-instruction">
              班のメンバーの回答がすべて表示されたら、班の１人が１回だけボタンを押してください。
            </div>

          </div>


          <div
            id="ai-processing-${group}"
            class="ai-processing-status"
            style="display:none;"
          >
            AIが処理中です。少し待ってください。
          </div>


          <div
            id="ai-result-${group}"
            class="ai-result"
            style="display:none;"
          >

            <div class="ai-result-title">
              AIからの問い
            </div>

            <div
              id="ai-result-text-${group}"
            ></div>

          </div>

        </div>

      `;


      groupsContainer.appendChild(
        groupElement
      );

    }


    // ========================================
    // 授業情報を取得
    // ========================================

    let lessonData = null;


    async function loadLesson() {

      if (!lessonId) {

        document.getElementById(
          "question"
        ).textContent =
          "授業IDが指定されていません。";

        return;

      }


      try {

        const lessonRef =
          doc(
            db,
            "lessons",
            lessonId
          );


        const lessonSnap =
          await getDoc(
            lessonRef
          );


        if (!lessonSnap.exists()) {

          document.getElementById(
            "question"
          ).textContent =
            "授業が見つかりませんでした。";

          return;

        }


        lessonData =
          lessonSnap.data();


        document.getElementById(
          "question"
        ).textContent =
          lessonData.question || "";


      } catch (error) {

        console.error(error);


        document.getElementById(
          "question"
        ).textContent =
          "授業情報の取得中にエラーが発生しました。";

      }

    }


    loadLesson();


    // ========================================
    // 班のタブを切り替える
    // ========================================

    const tabs =
      document.querySelectorAll(
        ".tab"
      );


    const groupContents =
      document.querySelectorAll(
        ".group-content"
      );


    tabs.forEach(tab => {

      tab.addEventListener(
        "click",
        () => {

          const group =
            tab.dataset.group;


          tabs.forEach(
            otherTab => {

              otherTab.classList.remove(
                "active"
              );

            }
          );


          tab.classList.add(
            "active"
          );


          groupContents.forEach(
            content => {

              content.classList.remove(
                "active"
              );

            }
          );


          const selectedContent =
            document.querySelector(
              `[data-group-content="${group}"]`
            );


          if (selectedContent) {

            selectedContent.classList.add(
              "active"
            );

          }

        }
      );

    });


    // ========================================
    // 入力中表示のタイマー
    // ========================================

    const typingTimers = {};


    function clearTyping(
      group,
      student
    ) {

      const answerRef =
        doc(
          db,
          "lessons",
          lessonId,
          "groups",
          String(group),
          "responses",
          String(student)
        );


      setDoc(
        answerRef,
        {
          isTyping: false,
          typingClientId: null
        },
        {
          merge: true
        }
      ).catch(error => {

        console.error(
          "入力中状態の解除エラー:",
          error
        );

      });

    }


    // ========================================
    // 回答入力中の処理
    // ========================================

    const textareas =
      document.querySelectorAll(
        "textarea"
      );


    textareas.forEach(textarea => {

      textarea.addEventListener(
        "input",
        () => {

          const id =
            textarea.id;


          const parts =
            id.split("-");


          const group =
            parts[1];


          const student =
            parts[2];


          const answerRef =
            doc(
              db,
              "lessons",
              lessonId,
              "groups",
              String(group),
              "responses",
              String(student)
            );


          setDoc(
            answerRef,
            {
              isTyping: true,
              typingClientId: clientId,
              typingAt: serverTimestamp()
            },
            {
              merge: true
            }
          ).catch(error => {

            console.error(
              "入力中状態の保存エラー:",
              error
            );

          });


          clearTimeout(
            typingTimers[id]
          );


          typingTimers[id] =
            setTimeout(
              () => {

                clearTyping(
                  group,
                  student
                );

              },
              5000
            );

        }
      );


      textarea.addEventListener(
        "blur",
        () => {

          const id =
            textarea.id;


          const parts =
            id.split("-");


          const group =
            parts[1];


          const student =
            parts[2];


          clearTimeout(
            typingTimers[id]
          );


          clearTyping(
            group,
            student
          );

        }
      );

    });


    // ========================================
    // 回答をFirestoreに保存
    // ========================================

    const submitButtons =
      document.querySelectorAll(
        ".submit-button"
      );


    submitButtons.forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const group =
            button.dataset.group;


          const student =
            button.dataset.student;


          const textarea =
            document.getElementById(
              `answer-${group}-${student}`
            );


          const answer =
            textarea.value.trim();


          const status =
            document.getElementById(
              `status-${group}-${student}`
            );


          if (!answer) {

            status.textContent =
              "回答を入力してください。";

            return;

          }


          try {

            status.textContent =
              "保存中……";


            const answerRef =
              doc(
                db,
                "lessons",
                lessonId,
                "groups",
                String(group),
                "responses",
                String(student)
              );


            /*
             * すでに別の端末が回答を保存している場合は
             * 上書きしない。
             */
            await runTransaction(
              db,
              async transaction => {

                const answerSnap =
                  await transaction.get(
                    answerRef
                  );


                const existingData =
                  answerSnap.exists()
                    ? answerSnap.data()
                    : {};


                if (
                  existingData.answer &&
                  existingData.answer.trim() !== ""
                ) {

                  throw new Error(
                    "この回答欄はすでに使用されています。"
                  );

                }


                transaction.set(
                  answerRef,
                  {
                    answer: answer,
                    updatedAt:
                      serverTimestamp(),
                    isTyping: false,
                    typingClientId: null
                  },
                  {
                    merge: true
                  }
                );

              }
            );


            status.textContent =
              "回答を保存しました。";


          } catch (error) {

            console.error(error);


            if (
              error.message ===
              "この回答欄はすでに使用されています。"
            ) {

              status.textContent =
                "この回答欄はすでに使用されています。";

            } else {

              status.textContent =
                "保存中にエラーが発生しました。";

            }

          }

        }
      );

    });


    // ========================================
    // Firestoreの回答をリアルタイム表示
    // ========================================

    for (
      let group = 1;
      group <= 12;
      group++
    ) {

      const responsesRef =
        collection(
          db,
          "lessons",
          lessonId,
          "groups",
          String(group),
          "responses"
        );


      onSnapshot(
        responsesRef,
        snapshot => {

          snapshot.forEach(
            docSnapshot => {

              const student =
                docSnapshot.id;


              const data =
                docSnapshot.data();


              const answerArea =
                document.getElementById(
                  `submitted-${group}-${student}`
                );


              const textarea =
                document.getElementById(
                  `answer-${group}-${student}`
                );


              const submitButton =
                document.querySelector(
                  `.submit-button[data-group="${group}"][data-student="${student}"]`
                );


              const typingArea =
                document.getElementById(
                  `typing-${group}-${student}`
                );


              if (!answerArea) {
                return;
              }


              // --------------------------------
              // 保存された回答
              // --------------------------------

              if (data.answer) {

                answerArea.textContent =
                  data.answer;


                answerArea.style.display =
                  "block";


                /*
                 * 現在入力中の本人の画面を
                 * Firestoreの更新で上書きしない
                 */
                if (
                  document.activeElement !==
                  textarea
                ) {

                  textarea.value =
                    data.answer;

                }


                /*
                 * 回答済みの欄は全端末で
                 * 編集・再利用できないようにする
                 */
                textarea.disabled = true;


                if (submitButton) {

                  submitButton.disabled =
                    true;

                }

              }


              // --------------------------------
              // 入力中表示
              // --------------------------------

              if (
                data.isTyping === true &&
                data.typingClientId &&
                data.typingClientId !== clientId
              ) {

                typingArea.textContent =
                  `🔵 ${student}は入力中です`;

              } else {

                typingArea.textContent =
                  "";

              }

            }
          );

        },
        error => {

          console.error(
            "リアルタイム取得エラー:",
            error
          );

        }
      );

    }


    // ========================================
    // AIボタン
    // ========================================

    const aiButtons =
      document.querySelectorAll(
        ".ai-button"
      );


    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbyT6OiEgEPmSooooI9FD3a5ty5HQx4A1VRfTkQfNY-c7uuht1wNcXk2197o4ggLTuMs/exec";


    aiButtons.forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const group =
            button.dataset.group;


          const processingArea =
            document.getElementById(
              `ai-processing-${group}`
            );


          /*
           * ====================================
           * AI処理ロックを取得
           * ====================================
           *
           * AさんとBさんがほぼ同時に押しても、
           * Firestoreのトランザクションによって
           * どちらか一方だけがロックを取得する。
           */

          const groupRef =
            doc(
              db,
              "lessons",
              lessonId,
              "groups",
              String(group)
            );


          let lockAcquired =
            false;


          try {

            await runTransaction(
              db,
              async transaction => {

                const groupSnap =
                  await transaction.get(
                    groupRef
                  );


                const groupData =
                  groupSnap.exists()
                    ? groupSnap.data()
                    : {};


                if (
                  groupData.aiProcessing === true
                ) {

                  /*
                   * 2分以上経過しているロックは
                   * 前の端末が異常終了した可能性があるため
                   * 古いロックとして扱う。
                   */

                  let isStale =
                    false;


                  if (
                    groupData.aiProcessingAt
                  ) {

                    const processingTime =
                      groupData.aiProcessingAt.toMillis();


                    const now =
                      Date.now();


                    const elapsed =
                      now - processingTime;


                    if (
                      elapsed >
                      2 * 60 * 1000
                    ) {

                      isStale =
                        true;

                    }

                  }


                  if (!isStale) {

                    throw new Error(
                      "AI処理中です。少し待ってください。"
                    );

                  }

                }


                transaction.set(
                  groupRef,
                  {
                    aiProcessing: true,
                    aiProcessingClientId:
                      clientId,
                    aiProcessingAt:
                      Timestamp.now()
                  },
                  {
                    merge: true
                  }
                );


                lockAcquired =
                  true;

              }
            );


            if (!lockAcquired) {

              return;

            }


            // --------------------------------
            // AI処理中表示
            // --------------------------------

            processingArea.style.display =
              "block";


            button.disabled =
              true;


            button.textContent =
              "生成中…";


            // =================================
            // 授業情報を再取得
            // =================================

            const lessonRef =
              doc(
                db,
                "lessons",
                lessonId
              );


            const lessonSnap =
              await getDoc(
                lessonRef
              );


            if (!lessonSnap.exists()) {

              throw new Error(
                "授業情報が見つかりません。"
              );

            }


            const currentLessonData =
              lessonSnap.data();


            // =================================
            // 班の回答を取得
            // =================================

            const responsesRef =
              collection(
                db,
                "lessons",
                lessonId,
                "groups",
                String(group),
                "responses"
              );


            const responsesSnap =
              await new Promise(
                (resolve, reject) => {

                  const unsubscribe =
                    onSnapshot(
                      responsesRef,
                      snapshot => {

                        unsubscribe();

                        resolve(
                          snapshot
                        );

                      },
                      error => {

                        unsubscribe();

                        reject(
                          error
                        );

                      }
                    );

                }
              );


            const answers = [];


            responsesSnap.forEach(
              docSnapshot => {

                const data =
                  docSnapshot.data();


                if (
                  data.answer &&
                  data.answer.trim() !== ""
                ) {

                  answers.push(
                    {
                      number:
                        docSnapshot.id,
                      answer:
                        data.answer
                    }
                  );

                }

              }
            );


            // =================================
            // GASへ送信
            // =================================

            const response =
              await fetch(
                GAS_URL,
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "text/plain;charset=utf-8"
                  },

                  body: JSON.stringify(
                    {
                      question:
                        currentLessonData.question || "",

                      mainContentItem:
                        currentLessonData.mainContentItem || "",

                      relatedContentItems:
                        currentLessonData.relatedContentItems || [],

                      answers:
                        answers
                    }
                  )
                }
              );


            if (!response.ok) {

              throw new Error(
                "AIサーバーとの通信に失敗しました。"
              );

            }


            const result =
              await response.json();


            /*
             * GASから返ってくるAI回答を取得
             */
            const aiText =
              result.result ||
              result.text ||
              result.answer ||
              "";


            if (!aiText) {

              throw new Error(
                "AIから回答を取得できませんでした。"
              );

            }


            // =================================
            // AI結果をFirestoreに保存
            // =================================

            await setDoc(
              groupRef,
              {
                aiResult:
                  aiText,

                aiUpdatedAt:
                  serverTimestamp()
              },
              {
                merge: true
              }
            );


          } catch (error) {

            console.error(
              "AI処理エラー:",
              error
            );


            if (
              error.message ===
              "AI処理中です。少し待ってください。"
            ) {

              alert(
                "この班では、すでにAIが処理中です。\n少し待ってください。"
              );

            } else {

              alert(
                "AI処理中にエラーが発生しました。\nもう一度お試しください。"
              );

            }

          } finally {

            /*
             * =================================
             * AI処理ロックを解除
             * =================================
             *
             * 自分が取得したロックだけを解除する。
             * 別の端末が取得したロックは解除しない。
             */

            try {

              const latestGroupSnap =
                await getDoc(
                  groupRef
                );


              if (
                latestGroupSnap.exists()
              ) {

                const latestData =
                  latestGroupSnap.data();


                if (
                  latestData.aiProcessingClientId ===
                  clientId
                ) {

                  await setDoc(
                    groupRef,
                    {
                      aiProcessing: false,
                      aiProcessingClientId:
                        null,
                      aiProcessingAt:
                        null
                    },
                    {
                      merge: true
                    }
                  );

                }

              }

            } catch (unlockError) {

              console.error(
                "AIロック解除エラー:",
                unlockError
              );

            }

          }

        }
      );

    });


    // ========================================
    // AI状態・AI結果をリアルタイム表示
    // ========================================

    for (
      let group = 1;
      group <= 12;
      group++
    ) {

      const groupRef =
        doc(
          db,
          "lessons",
          lessonId,
          "groups",
          String(group)
        );


      onSnapshot(
        groupRef,
        snapshot => {

          if (!snapshot.exists()) {
            return;
          }


          const data =
            snapshot.data();


          const aiButton =
            document.querySelector(
              `.ai-button[data-group="${group}"]`
            );


          const processingArea =
            document.getElementById(
              `ai-processing-${group}`
            );


          const resultArea =
            document.getElementById(
              `ai-result-${group}`
            );


          const resultText =
            document.getElementById(
              `ai-result-text-${group}`
            );


          // --------------------------------
          // AI処理中
          // --------------------------------

          if (
            data.aiProcessing === true
          ) {

            processingArea.style.display =
              "block";


            aiButton.disabled =
              true;


            if (
              data.aiProcessingClientId ===
              clientId
            ) {

              aiButton.textContent =
                "生成中…";

            } else {

              aiButton.textContent =
                "待機中";

            }

          } else {

            processingArea.style.display =
              "none";


            aiButton.disabled =
              false;


            aiButton.textContent =
              "AI";

          }


          // --------------------------------
          // AI結果
          // --------------------------------

          if (
            data.aiResult
          ) {

            resultArea.style.display =
              "block";


            resultText.textContent =
              data.aiResult;

          }

        },
        error => {

          console.error(
            "AI状態取得エラー:",
            error
          );

        }
      );

    }

  </script>

</body>
</html>
